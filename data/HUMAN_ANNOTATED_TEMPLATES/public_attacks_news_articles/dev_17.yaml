  document_theme: the cafetería rolando bombing
  original_document: The Cafetería Rolando bombing was an attack on 13 September 1974 at the Rolando cafe in Calle del Correo, Madrid, Spain which killed 13 people and wounded 71. Though no claim of responsibility was made, the attack is widely believed to have been carried out by the armed Basque separatist group ETA.==Background==The Rolando Cafe was located on 4 Calle del Correo in Madrid, close to the General Directorate of Security, the headquarters of the Spanish Police. It was regularly frequented by members of the police force and security services.==The attack==The bomb was placed at the entrance to the building and exploded on a Friday afternoon, during a busy lunchtime period. More than 300 people were eating in the neighbouring El Tobogan restaurant at the time of the explosion, two of whom were among the dead. The explosion caused significant damage to nearby buildings, shattering the windows of the nearby General Directorate of Security, while two cars parked nearby were totally destroyed. The bomb caused part of the Rolando Cafe's ceiling to collapse and guests staying in a pension above were injured due to falling through the gaps in the ceiling. The police immediately
    arrived and cordoned off the scene.Two of the 12 initially killed and 11 of the injured were members of the police force. However the wounded included the number two of the Spanish Political Police, with the remainder employees and customers of the cafe. A thirteenth victim died in 1977 of injuries suffered during the attack.==Responses and arrests==The leadership of ETA was taken aback by the responses to the attack and on 15 September, issued a statement denying their responsibility, though implicitly defending the bombing, claiming that the cafe was full of police agents. This caused tensions within the group, with some members believing that the organisation had to admit responsibility for attacks carried out, even if the results were not those intended. The bombing gave those opposed to further liberalisation of the country, such as Blas Piñar, the opportunity to attack the Prime Minister Carlos Arias Navarro.In the immediate period of confusion following the attack, some blamed the attack on the far-right. The police, however, concluded that ETA were responsible and launched an operation against the group's infrastructure in Madrid. Initially the police also blamed the Communist
    Party of Spain (PCE) of cooperating in the attack, but the PCE energetically denied involvement. Reports that police officers had received a circular advising them not to go to the Rolando Cafe or stand outside the building added to the mystery surrounding the incident.Leftists known to be sympathetic to ETA were arrested, including Eva Forest, wife of the communist playwright Alfonso Sastre, Mari Luz Fernandez and her relatives, Lidia Falcón, the theatre director Vicente Sainz de la Peña, construction worker Antonio Durán, pilot Bernardo Badell and his wife María del Carmen Nadal, the actress María Paz Ballesteros, and the writer Eliseo Bayo. Between June 1975 and February 1976, courts dismissed the cases and released the defendants. However Eva Forest and Mari Luz Fernandez remained in prison as they were charged with complicity in the assassination of Luis Carrero Blanco one year before. However, neither Forest nor Luz Fernandez were tried for the Rolando bombing, as they were released in June 1977 as part of a general amnesty for political prisoners. In 1981 Lidia Falcón published a denunciation of Eva Forest which suggested that Forest's role in the Rolando attack had been considerable.The
    government also offered a reward of one million pesetas for information leading to the capture of Juan Manuel Galarraga Mendizabal who they suspected of being a high ranking ETA figure involved in the bombing. Exact authorship of the bombing has however remained a mystery.==References==
