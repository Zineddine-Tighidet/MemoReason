  original_document: 'MercadoLibre, Inc., known as Mercado Livre in Brazil, literally meaning "free market" in both languages, is a company of Argentine origin headquartered in Montevideo, Uruguay and incorporated in Delaware in the United States that operates online marketplaces dedicated to e-commerce and online auctions. As of 2016, Mercado Libre had 174.2 million users in Latin America, making it the region''s most popular e-commerce site by number of visitors.


    Aside from being the leading player in Argentina''s e-commerce market, it also has operations in Bolivia, Brazil, Chile, Colombia, Costa Rica, the Dominican Republic, Ecuador, El Salvador, Guatemala, Honduras, Mexico, Nicaragua, Panama, Paraguay, Peru, Uruguay, and Venezuela. In 2023, Time included Mercado Libre in the list of the 100 most influential companies in the world.'
